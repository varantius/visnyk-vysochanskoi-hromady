name: Перевірка документів громади

on:
  schedule:
    - cron: "0 * * * *"     # раз в час
  workflow_dispatch:         # кнопка «запустить вручную» во вкладке Actions

permissions:
  contents: write            # чтобы скрипт мог сохранить sent.json обратно

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: node index.js
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Зберегти список відправлених
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add sent.json
          git diff --staged --quiet || git commit -m "update sent.json"
          git push
